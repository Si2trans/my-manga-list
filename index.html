<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Si2Trans</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" href="data/site-data.json" as="fetch" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css?v=20260629-system-redesign">
</head>
<body>
  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot-window">
      <div class="boot-titlebar">
        <span></span><span></span><span></span>
      </div>
      <div class="boot-body">
        <div class="boot-kicker">SI2TRANS SYSTEM</div>
        <div class="boot-title">กำลังโหลดฐานข้อมูลมังงะ</div>
        <div class="boot-meter" aria-hidden="true"><span></span></div>
        <div class="boot-log">sync catalog / chapters / sources</div>
      </div>
    </div>
  </div>

  <header class="app-header">
    <div class="shell header-shell">
      <a class="brand" href="#" aria-label="Si2Trans">
        <span class="brand-mark">S2</span>
        <span>
          <span class="brand-name">SI2TRANS</span>
          <span class="brand-sub">มังฮัวแปลไทย</span>
        </span>
      </a>

      <div class="header-stats" aria-label="สรุปข้อมูล">
        <div>
          <b id="stat-series">0</b>
          <span>เรื่อง</span>
        </div>
        <div>
          <b id="stat-chapters">0</b>
          <span>ตอน</span>
        </div>
      </div>
    </div>
  </header>

  <main class="shell app-main">
    <section class="toolbar" aria-label="เครื่องมือค้นหา">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"/>
        </svg>
        <input id="search" type="search" autocomplete="off" placeholder="ค้นหาชื่อเรื่อง..." aria-label="ค้นหาชื่อเรื่อง">
      </div>

      <div class="segmented" role="group" aria-label="ตัวกรอง">
        <button class="segment active" type="button" data-filter="all">ทั้งหมด</button>
        <button class="segment" type="button" data-filter="อัปเดต">อัปเดต</button>
        <button class="segment" type="button" data-filter="จบ">จบแล้ว</button>
        <button class="segment" type="button" data-filter="ใหม่">ใหม่</button>
      </div>
    </section>

    <section class="catalog-head">
      <div>
        <p class="eyebrow">CATALOG</p>
        <h1>รายการมังงะ</h1>
      </div>
      <p id="result-count">กำลังโหลด...</p>
    </section>

    <section class="catalog" id="catalog" aria-label="รายการมังงะ">
      <article class="skeleton-card"></article>
      <article class="skeleton-card"></article>
      <article class="skeleton-card"></article>
      <article class="skeleton-card"></article>
    </section>
  </main>

  <footer class="shell app-footer">
    <a href="https://mynovel.co/w/Si2trans" target="_blank" rel="noopener noreferrer">MYNOVEL</a>
    <a href="https://readrealm.co/profile/si2transs" target="_blank" rel="noopener noreferrer">ReadRealm</a>
    <a href="https://readtoon.com/profile/si2trans" target="_blank" rel="noopener noreferrer">ReadToon</a>
  </footer>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawer-title">
    <div class="drawer-grip" aria-hidden="true"></div>
    <button class="icon-btn drawer-close" id="drawer-close" type="button" aria-label="ปิด">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div class="drawer-layout">
      <div class="drawer-cover-wrap">
        <img id="drawer-cover" alt="" loading="lazy">
      </div>
      <div class="drawer-content">
        <div class="drawer-meta">
          <span id="drawer-status"></span>
          <span id="drawer-latest"></span>
        </div>
        <h2 id="drawer-title">-</h2>
        <p id="drawer-desc"></p>
        <div class="drawer-sources" id="drawer-sources"></div>
        <div class="chapter-head">
          <div>
            <p class="eyebrow">CHAPTERS</p>
            <h3>เลือกตอน</h3>
          </div>
          <button class="text-btn" id="chapter-order" type="button">ตอนล่าสุดก่อน</button>
        </div>
        <div class="chapter-groups" id="drawer-chapters"></div>
      </div>
    </div>
  </aside>

  <script src="script.js?v=20260629-system-redesign"></script>
</body>
</html>
